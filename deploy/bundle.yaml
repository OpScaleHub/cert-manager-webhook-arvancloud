# Source: arvancloud-webhook/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arvancloud-webhook
  namespace: cert-manager
  labels:
    helm.sh/chart: arvancloud-webhook-0.1.0
    app.kubernetes.io/name: arvancloud-webhook
    app.kubernetes.io/instance: arvancloud-webhook
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.1.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: arvancloud-webhook
      app.kubernetes.io/instance: arvancloud-webhook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arvancloud-webhook
        app.kubernetes.io/instance: arvancloud-webhook
    spec:
      serviceAccountName: arvancloud-webhook
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: webhook
          image: "ghcr.io/opscalehub/cert-manager-webhook-arvancloud:0.1.0"
          imagePullPolicy: IfNotPresent
          args:
            - --tls-cert-file=/tls/tls.crt
            - --tls-private-key-file=/tls/tls.key
            - --secure-port=8443
            - -v=2
          env:
            - name: GROUP_NAME
              value: "acme.arvancloud.ir"
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 32Mi
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tls
          secret:
            secretName: arvancloud-webhook-webhook-tls
        - name: tmp
          emptyDir: {}
