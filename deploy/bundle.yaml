# Source: arvancloud-webhook/templates/rbac.yaml
# Grant the webhook's apiserver permission to create SubjectAccessReviews to
# authenticate incoming requests, and to read the extension-apiserver auth
# configmap in kube-system.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: arvancloud-webhook:auth-delegator
  labels:
    helm.sh/chart: arvancloud-webhook-0.1.0
    app.kubernetes.io/name: arvancloud-webhook
    app.kubernetes.io/instance: arvancloud-webhook
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.1.0"
rules:
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
