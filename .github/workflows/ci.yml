name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  HELM_VERSION: v3.18.4

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1
      - name: Vet (incl. conformance build tag)
        run: go vet -tags conformance ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.3.0

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Lint chart
        run: helm lint charts/arvancloud-webhook
      - name: Template chart
        run: helm template t charts/arvancloud-webhook --namespace cert-manager > /dev/null
      - name: Bundle is up to date
        run: |
          helm template arvancloud-webhook charts/arvancloud-webhook \
            --namespace cert-manager > /tmp/bundle.rendered
          # -B tolerates cosmetic blank-line changes between helm patch versions;
          # any real template change still fails the job.
          diff -u -B deploy/bundle.yaml /tmp/bundle.rendered

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
